<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online form</title>
</head>
<body>
    <h3 align="center">Online Registration Form</h3>
    <form action="#" method="">
    First Name: <input type="text" placeholder="Enter your first Name"><br>
    Middle Name <input type="text" placeholder="Enter your middle Name"><br>
    Last Name: <input type="text" placeholder="Enter your Last name"> <br>
    Address: <textarea cols="20" rows="5"></textarea> <br>
    Password:<input type="password" placeholder="Enter Your Password"><br>

    gender<br>
    Male: <input type="radio" name="gender">
    Female: <input type="radio" name="gender"><br>
    Select your country <select>
        <option>Select</option> 
        <option>Nepal</option>
        <option>USA</option>
        <option>UK</option>
    </select><br>
    Hobbies:<br>
    Dance:<input type="checkbox" name="Dance"><br>
    Trekking:<input type="checkbox" name="Trekking"><br>
    Sing:<input type="checkbox" name="Sing"><br>
    Movies:<input type="checkbox" name="Movies">
    <br>

    Please upload your file<input type="file"><br>

    <input type="submit" value="Register Me">
    <input type="reset" value="Cancel">
</form>
</body>
</html>
