<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: gray;
            color:black;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: blue;
            color:white;
            padding: 20px 40px;
        }
        .navlink a{
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }
        .main-container{
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
        }
        .content-body{
            flex: 3;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
        }
        .sidebar-left, .sidebar-right{
            flex: 1;
            background-color: blueviolet;
            padding:20px;
            border-radius: 5px;
        }
        .footer{
            display:flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            color: white;
            padding: 15px;
            text-align: center;
        }

        @media(max-width: 768px)
        {
            .navbar, .main-container{
                flex-direction: column;
            }
            .navlink{
                margin-top: 15px;
                display: flex;
                gap:10px;
        
            }
            .navlink a
            {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="Logo">MIT</div>
        <nav class="navlink">
            <a href="home.html">Home</a>
            <a href="aboutus.html">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <main class="main-container">
        <aside class="sidebar-left">
            <h3>Sidebar Left</h3>
            <p>Testing</p>
        </aside>

        <section class="content-body">
            <h2>Main Content Area</h2>
            <p>Testing</p>
        </section>

        <aside class="sidebar-right">
            <h3>Sidebar Right</h3>
            <p>test.</p>
        </aside>
    </main>
</body>
</html>
