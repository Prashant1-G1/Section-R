<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Number Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: gainsboro;
        }

        .container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
            width: 300px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .input-section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input[type="number"] {
            padding: 8px;
            margin: 10px 5px;
            width: 100px;
            border: 1px solid black;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: green;
        }

        button:active {
            background-color:lightgreen;
        }

        #randomNumber {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }

        #reset {
            background-color: #f44336;
            margin-top: 10px;
        }

        #reset:hover {
            background-color: #e53935;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Random Number Generator</h1>

        <div class="input-section">

            <label for="min">Minimum:</label>

            <input 
                type="number" 
                id="min" 
                value="1"
            >

            <label for="max">Maximum:</label>

            <input 
                type="number" 
                id="max" 
                value="6"
            >

        </div>

        <button id="generate">
            Generate Random Number
        </button>

        <div class="result">

            <p id="randomNumber">
                Click the button to generate
            </p>

        </div>

        <button id="reset">
            Reset
        </button>

    </div>


    <script>

        
        const minInput = document.getElementById("min");
        const maxInput = document.getElementById("max");

        const generateButton =
            document.getElementById("generate");

        const resetButton =
            document.getElementById("reset");

        const randomNumber =
            document.getElementById("randomNumber");


        // Generate Random Number
        generateButton.addEventListener("click", function () {

            // Get minimum and maximum values
            let min = Number(minInput.value);
            let max = Number(maxInput.value);


            // Check whether minimum is greater than maximum
            if (min > max) {

                randomNumber.textContent =
                    "Minimum cannot be greater than Maximum";

                return;
            }


            // Generate random number
            let result =
                Math.floor(
                    Math.random() * (max - min + 1)
                ) + min;


            // Display result
            randomNumber.textContent = result;

        });


        // Reset Button
        resetButton.addEventListener("click", function () {

            // Reset input values
            minInput.value = 1;
            maxInput.value = 6;


            // Reset result
            randomNumber.textContent =
                "Click the button to generate";

        });

    </script>

</body>

</html>
