
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive image slider built with vanilla JavaScript.">
  <title>Image Slider Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="slider.js" defer></script>
</head>
<body>
  <main class="page">
    <h1>Image Slider Library</h1>
    <p class="subtitle">
      Explore beautiful places around the world.
    </p>

    <section class="slider" aria-label="Photo gallery">
      <div class="slider-viewport">
        <div class="slider-track" id="sliderTrack">
          <div class="slide">
            <img
              src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1400&auto=format&fit=crop"
              alt="Mountain landscape under a wide open sky">
          </div>

          <div class="slide">
            <img
              src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1400&auto=format&fit=crop"
              alt="Mountain lake surrounded by green hills">
          </div>

          <div class="slide">
            <img
              src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1400&auto=format&fit=crop"
              alt="Scenic lake and mountain landscape">
          </div>

          <div class="slide">
            <img
              src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1400&auto=format&fit=crop"
              alt="High mountain peaks in the distance">
          </div>
        </div>
      </div>

      <button
        class="slider-btn prev-btn"
        id="prevBtn"
        type="button"
        aria-label="Previous image">
        &#10094;
      </button>

      <button
        class="slider-btn next-btn"
        id="nextBtn"
        type="button"
        aria-label="Next image">
        &#10095;
      </button>

      <div
        class="slider-dots"
        id="sliderDots"
        aria-label="Choose an image">
      </div>

      <p class="slide-status" id="slideStatus"
         aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
